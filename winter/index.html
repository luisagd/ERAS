<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
        body {
            font-family: "Comic Neue", "Comic Sans MS", cursive, sans-serif;
        }
    </style>
</head>

<body>
    <div style="display: flex;">
        <img src="img.avif" alt="Lock Icon" />
        <div style="padding: 1%;">
            <h1>Log in page</h1>
            <h2>Alright, log in buddy.</h2>

            <form style="padding: 1vw;" onsubmit="alert('Logging in...'); return false;">
                <label for="username">Username:</label><br />
                <input type="text" id="username" name="username" min="3" /><br />
                <label for="password">Password:</label><br />
                <input type="password" id="password" name="password" min="8" /><br /><br />
                <input type="submit" value="Log In" style="background-color: green; color: aliceblue; border: none; padding: 0.5em 1em; cursor: pointer;" />
            </form>
        </div>
    </div>
</body>

</html>
